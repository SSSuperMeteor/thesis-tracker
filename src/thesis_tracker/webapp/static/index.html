<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Thesis Tracker 本机工作台</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a class="skip-link" href="#main">跳到主内容</a>

<!-- The hatching used for a hole in a filing history.  Icons live in /sprite.svg. -->
<svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 6L6 0M-1 1L1 -1M5 7L7 5" style="stroke: var(--none); stroke-width: 1.2; fill: none"></path>
    </pattern>
  </defs>
</svg>

<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="#/overview" aria-label="Thesis Tracker，回到总览">
      <svg class="brand-mark" aria-hidden="true" focusable="false"><use href="/sprite.svg#mark"></use></svg>
      <span class="brand-text">Thesis Tracker<small>本机研究工作台</small></span>
    </a>
    <nav class="nav" id="nav" aria-label="主导航"></nav>
    <div class="price-status" id="price-status"></div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p>这个工作台需要 JavaScript 才能显示数据。</p></noscript>
<script src="/app.js" type="module"></script>
</body>
</html>
